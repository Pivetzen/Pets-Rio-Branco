<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custos do Animal - Resgate Animal Regional</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --success: #10b981;
      --danger: #ef4444;
      --bg-main: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --radius: 16px;
      --shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); padding: 40px 20px; }
    .container { max-width: 900px; margin: 0 auto; }
    .btn-back { display: inline-flex; align-items: center; gap: 8px; background: #e0e7ff; color: var(--primary); padding: 10px 20px; border-radius: 30px; text-decoration: none; font-weight: 700; font-size: 0.9rem; margin-bottom: 24px; }
    
    .profile-card { background: var(--card-bg); border-radius: var(--radius); padding: 30px; box-shadow: var(--shadow); border: 1px solid var(--border-color); display: grid; grid-template-columns: 280px 1fr; gap: 30px; margin-bottom: 30px; }
    .profile-img-wrapper { height: 260px; border-radius: 12px; overflow: hidden; background: #e2e8f0; position: relative; }
    .profile-img-wrapper img { width: 100%; height: 100%; object-fit: cover; }
    .badge-status { position: absolute; top: 12px; right: 12px; padding: 6px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: white; }
    .badge-status.tratamento { background: #f59e0b; }
    .badge-status.adocao { background: #10b981; }

    .profile-info h1 { font-size: 2rem; font-weight: 800; }
    .species-tag { display: inline-block; background: #f1f5f9; padding: 4px 12px; border-radius: 6px; font-size: 0.85rem; color: var(--text-muted); font-weight: 600; margin-left: 10px; }
    .history-text { margin: 12px 0 20px 0; color: var(--text-muted); font-size: 0.95rem; }

    .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
    .metric-box { background: #f8fafc; border: 1px solid var(--border-color); padding: 16px; border-radius: 12px; text-align: center; }
    .metric-box label { font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; display: block; }
    .metric-box .val { font-size: 1.4rem; font-weight: 800; margin-top: 4px; }
    .metric-box .val.red { color: var(--danger); }

    .progress-box { margin-bottom: 24px; }
    .progress-labels { display: flex; justify-content: space-between; font-size: 0.85rem; font-weight: 700; margin-bottom: 6px; }
    .progress-bar-bg { height: 10px; background: #e2e8f0; border-radius: 5px; overflow: hidden; }
    .progress-bar-fill { height: 100%; background: var(--danger); border-radius: 5px; }

    .table-section { background: var(--card-bg); border-radius: var(--radius); padding: 30px; box-shadow: var(--shadow); border: 1px solid var(--border-color); }
    .table-header { margin-bottom: 20px; }
    .table-header h2 { font-size: 1.25rem; font-weight: 700; }
    .table-header p { font-size: 0.85rem; color: var(--text-muted); }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th { text-align: left; padding: 12px; font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; border-bottom: 2px solid var(--border-color); }
    td { padding: 16px 12px; font-size: 0.9rem; border-bottom: 1px solid var(--border-color); }
    .tag-saida { background: #fee2e2; color: var(--danger); font-size: 0.75rem; font-weight: 700; padding: 4px 8px; border-radius: 6px; text-transform: uppercase; }

    @media (max-width: 768px) {
      .profile-card { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="container">
    <a href="index.html" class="btn-back"><i class="fa-solid fa-arrow-left"></i> Voltar ao Dashboard</a>

    <div class="profile-card" id="profile-container">
      <div style="grid-column: 1 / -1; text-align: center; padding: 40px;">
        <i class="fa-solid fa-spinner fa-spin fa-2x"></i>
        <p style="margin-top: 10px;">Carregando informações do animal...</p>
      </div>
    </div>

    <div class="table-section">
      <div class="table-header">
        <h2>Detalhamento de Custos Veterinários e Despesas</h2>
        <p>Listagem exclusiva de todos os procedimentos, exames e insumos gastos com este animal.</p>
      </div>

      <table>
        <thead>
          <tr>
            <th>Data</th>
            <th>Tipo</th>
            <th>Categoria</th>
            <th>Descrição</th>
            <th>Valor</th>
          </tr>
        </thead>
        <tbody id="tabela-gastos">
          <tr><td colspan="5" style="text-align: center; color: var(--text-muted);">Carregando histórico...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const URL_CSV_ANIMAIS = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSjf1I1A2-shkf9JdpBC7zfyuKwoRVjMGvhfFMgOs0Zt-0vobmSYPFYOoP9VUam14T_M1BC2PPP1WzP/pub?gid=0&single=true&output=csv";
    const URL_CSV_FINANCEIRO = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSjf1I1A2-shkf9JdpBC7zfyuKwoRVjMGvhfFMgOs0Zt-0vobmSYPFYOoP9VUam14T_M1BC2PPP1WzP/pub?gid=1564565152&single=true&output=csv";

    function getParametroURL(param) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(param);
    }

    function formatarMoeda(v) {
      return Number(v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    function converterValorFloat(str) {
      if (!str) return 0;
      let limpo = str.toString().replace("R$", "").trim().replace(".", "").replace(",", ".");
      return parseFloat(limpo) || 0;
    }

    function obterPropriedade(obj, chavesPossiveis) {
      const keys = Object.keys(obj);
      for (let key of keys) {
        const keyClean = key.toLowerCase().trim();
        for (let busca of chavesPossiveis) {
          if (keyClean === busca.toLowerCase().trim() || keyClean.includes(busca.toLowerCase().trim())) {
            return obj[key];
          }
        }
      }
      return "";
    }

    const animalIdTarget = getParametroURL('id');

    function carregarPerfilAnimal() {
      if (!animalIdTarget) {
        alert("Animal não encontrado!");
        window.location.href = "index.html";
        return;
      }

      Papa.parse(URL_CSV_FINANCEIRO, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(resFin) {
          const gastosAnimal = [];
          let totalGastos = 0;

          resFin.data.forEach(t => {
            const animalId = obterPropriedade(t, ['animal_id', 'B (animal_id)']).trim();
            const tipo = obterPropriedade(t, ['tipo', 'D (tipo)']).trim().toLowerCase();

            // Filtra EXCLUSIVAMENTE as SAÍDAS associadas a este animal ID
            if (animalId === animalIdTarget && (tipo === 'saída' || tipo === 'saida')) {
              const valor = converterValorFloat(obterPropriedade(t, ['valor', 'G (valor)']));
              totalGastos += valor;
              gastosAnimal.push({
                data: obterPropriedade(t, ['data', 'C (data)']),
                categoria: obterPropriedade(t, ['categoria', 'E (categoria)']),
                descricao: obterPropriedade(t, ['descricao', 'F (descricao)']),
                valor: valor
              });
            }
          });

          Papa.parse(URL_CSV_ANIMAIS, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(resAnimais) {
              const rawAnimal = resAnimais.data.find(a => obterPropriedade(a, ['id', 'A (id)']).trim() === animalIdTarget);

              if (!rawAnimal) {
                alert("Animal não cadastrado na planilha.");
                window.location.href = "index.html";
                return;
              }

              const animal = {
                nome: obterPropriedade(rawAnimal, ['nome', 'B (nome)']) || 'Sem Nome',
                especie: obterPropriedade(rawAnimal, ['especie', 'C (especie)']),
                status: obterPropriedade(rawAnimal, ['status', 'D (status)']),
                foto: obterPropriedade(rawAnimal, ['foto_url', 'E (foto_url)']),
                historia: obterPropriedade(rawAnimal, ['historia', 'F (historia)']),
                meta: converterValorFloat(obterPropriedade(rawAnimal, ['meta_financeira', 'G (meta_financeira)']))
              };

              renderizarPerfil(animal, totalGastos);
              renderizarTabelaGastos(gastosAnimal);
            }
          });
        }
      });
    }

    function renderizarPerfil(animal, totalGastos) {
      const container = document.getElementById('profile-container');
      const percentual = animal.meta > 0 ? Math.min(Math.round((totalGastos / animal.meta) * 100), 100) : 0;
      const statusClass = (animal.status || '').toLowerCase().replace('çã', 'ca');

      container.innerHTML = `
        <div class="profile-img-wrapper">
          <img src="${animal.foto}" alt="${animal.nome}" onerror="this.src='https://via.placeholder.com/400x300?text=Sem+Foto'">
          <span class="badge-status ${statusClass}">${animal.status}</span>
        </div>
        <div class="profile-info">
          <div>
            <h1 style="display:inline;">${animal.nome}</h1>
            <span class="species-tag">${animal.especie}</span>
          </div>
          <p class="history-text">${animal.historia}</p>

          <div class="metrics-grid">
            <div class="metric-box">
              <label>Meta Orçada</label>
              <div class="val">${formatarMoeda(animal.meta)}</div>
            </div>
            <div class="metric-box">
              <label>Total Gasto</label>
              <div class="val red">${formatarMoeda(totalGastos)}</div>
            </div>
          </div>

          <div class="progress-box">
            <div class="progress-labels">
              <span>Comprometimento da Meta</span>
              <span>${percentual}%</span>
            </div>
            <div class="progress-bar-bg">
              <div class="progress-bar-fill" style="width: ${percentual}%"></div>
            </div>
          </div>
        </div>
      `;
    }

    function renderizarTabelaGastos(gastos) {
      const tbody = document.getElementById('tabela-gastos');
      tbody.innerHTML = '';

      if (gastos.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--text-muted); padding: 30px;">Nenhum gasto registrado para este animal até o momento.</td></tr>`;
        return;
      }

      gastos.forEach(g => {
        tbody.innerHTML += `
          <tr>
            <td>${g.data}</td>
            <td><span class="tag-saida">Saída</span></td>
            <td><strong>${g.categoria}</strong></td>
            <td>${g.descricao}</td>
            <td style="color: var(--danger); font-weight: 700;">- ${formatarMoeda(g.valor)}</td>
          </tr>
        `;
      });
    }

    window.onload = carregarPerfilAnimal;
  </script>
</body>
</html>
